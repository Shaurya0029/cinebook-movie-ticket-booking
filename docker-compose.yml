services:
  postgres:
    image: postgres:16
    container_name: movieticketbooking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: movieapp
      POSTGRES_PASSWORD: movieapp
      POSTGRES_DB: movieticketbooking
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieapp -d movieticketbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
